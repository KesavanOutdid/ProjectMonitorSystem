services:
  # -------------------------------------------------------------
  # Redis Cache Engine (Sub-5ms response times)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pms-prod-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - pms_prod_redis_data:/data
    networks:
      - pms-prod-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # -------------------------------------------------------------
  # Backend API Service (Production Mode)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pms-prod-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_ENABLED=true
    env_file:
      - ./backend/.env.production
    volumes:
      - pms_prod_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pms-prod-network
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # -------------------------------------------------------------
  # Frontend Application (Next.js 14 Standalone Production)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_IP=${NEXT_PUBLIC_BACKEND_IP:-}
        - NEXT_PUBLIC_BACKEND_PORT=${NEXT_PUBLIC_BACKEND_PORT:-5000}
        - NEXT_PUBLIC_BACKEND_PROTOCOL=${NEXT_PUBLIC_BACKEND_PROTOCOL:-http}
        - NEXT_PUBLIC_SOCKET_IP=${NEXT_PUBLIC_SOCKET_IP:-}
        - NEXT_PUBLIC_SOCKET_PORT=${NEXT_PUBLIC_SOCKET_PORT:-5000}
        - NEXT_PUBLIC_SOCKET_PROTOCOL=${NEXT_PUBLIC_SOCKET_PROTOCOL:-http}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-}
        - NEXT_PUBLIC_REDIS_HOST=${REDIS_HOST:-redis}
        - NEXT_PUBLIC_REDIS_PORT=${REDIS_PORT:-6379}
    container_name: pms-prod-frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      - backend
    networks:
      - pms-prod-network
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pms_prod_redis_data:
    name: pms_prod_redis_data
  pms_prod_uploads:
    name: pms_prod_uploads

networks:
  pms-prod-network:
    name: pms-prod-network
    driver: bridge
